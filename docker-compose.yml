version: '3.8'

services:
  # 1. Database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Wakuja8789}
      POSTGRES_DB: ${DB_NAME:-wifi_voucher_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. Backend (Node.js)
  backend:
    build: ./backend
    environment:
      - NODE_ENV=production
      - DB_HOST=db
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "3000:3000"
    restart: unless-stopped

  # 3. Frontend (React + Nginx)
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: